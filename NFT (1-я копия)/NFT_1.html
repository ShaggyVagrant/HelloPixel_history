<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel NFT Viewer</title>
    <link rel="stylesheet" href="styles_nft.css">
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="pixel_nft_abi.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Шапка с кнопкой Назад -->
    <header class="app-header">
        <button type="button" class="back-btn" id="back-btn" aria-label="Назад">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
            <span>Назад</span>
        </button>
        <div class="app-header-title">Pixel NFT</div>
    </header>

    <div class="content">
        <!-- Левая часть -->
        <div class="left-panel">
            <div class="input-form">
                <h1>Input NFT ID</h1>
                <div class="network-selector">
                    <label>
                        <input type="radio" name="network" value="songbird" checked> Songbird
                    </label>
                    <label>
                        <input type="radio" name="network" value="skale"> Skale
                    </label>
                </div>
                <input type="text" id="tokenId" value="549203" placeholder="Enter Token ID">
                <button id="fetch-button">Get Info</button>
            </div>
            <div id="result" class="nft-info"></div>
        </div>

        <!-- Правая часть -->
        <div class="right-panel">
            <div class="nft-image-container">
                <h2 id="nft-name">NFT Name</h2>
                <img id="nft-image" src="" class="token-image" alt="NFT Image">
            </div>
            <div class="nft-modifiers">
                <h3>NFT Modifiers</h3>
                <div id="modifiers-list"></div>
            </div>
        </div>
    </div>

    <script>
        // Параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const nftId = urlParams.get('tokenId');
        const network = urlParams.get('network');

        if (nftId) {
            document.getElementById('tokenId').value = nftId;
        }

        if (network) {
            const networkRadios = document.querySelectorAll('input[name="network"]');
            networkRadios.forEach(radio => {
                radio.checked = (radio.value === network);
            });
        }

        // Автозапуск
        if (nftId) {
            setTimeout(() => {
                const fetchButton = document.getElementById('fetch-button');
                if (fetchButton && typeof validateAndFetch === 'function') {
                    fetchButton.click();
                }
            }, 1000);
        }

        // Кнопка Назад
        document.getElementById('back-btn').addEventListener('click', function () {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                try { window.close(); } catch (e) {}
            }
        });
    </script>
</body>
</html>
